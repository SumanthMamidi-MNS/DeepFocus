<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#171923" />
    </linearGradient>
    
    <!-- Neon Accent Glow Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>

    <!-- Center Icon Gradient -->
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1d5db" />
    </linearGradient>
  </defs>

  <!-- Maskable / App Shell Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" rx="128" />

  <!-- Glowing outer circular ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="20" stroke-linecap="round" opacity="0.9" />

  <!-- Lotus / Timer hybrid minimalist icon in the center -->
  <g transform="translate(166, 156)">
    <!-- Sandglass Silhouette -->
    <path d="M40 20 C40 60, 70 85, 90 100 C70 115, 40 140, 40 180 L140 180 C140 140, 110 115, 90 100 C110 85, 140 60, 140 20 Z" fill="url(#iconGrad)" opacity="0.95" />
    
    <!-- Flowing particles details -->
    <circle cx="90" cy="50" r="8" fill="#a78bfa" />
    <circle cx="90" cy="90" r="5" fill="#818cf8" />
    <circle cx="90" cy="115" r="4" fill="#6366f1" />
    <circle cx="90" cy="150" r="8" fill="#a78bfa" />
  </g>
</svg>
